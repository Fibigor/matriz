spring:
  application:
    name: matriz
  datasource:
    url: "${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:55432}/${DATABASE_NAME:matriz}}"
    username: ${DATABASE_USERNAME:matriz}
    password: ${DATABASE_PASSWORD}
  jackson:
    # Jackson 3 mapper, with Boot 3 JSON/date/coercion defaults; not the Jackson 2 module.
    use-jackson2-defaults: true
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
  sql:
    init:
      mode: never
  servlet:
    multipart:
      max-file-size: 4MB
      max-request-size: 21MB
server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  tomcat:
    # Bounded discard lets ordinary over-limit multipart requests receive the JSON 413
    # instead of a connection reset. This does not raise the 4/21 MiB acceptance limits.
    max-swallow-size: 32MB
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
matriz:
  demo:
    enabled: ${DEMO_ENABLED:false}
