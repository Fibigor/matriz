spring:
  application:
    name: matriz
  datasource:
    url: "${DATABASE_URL:jdbc:postgresql://${DATABASE_HOST:localhost}:${DATABASE_PORT:55432}/${DATABASE_NAME:matriz}}"
    username: ${DATABASE_USERNAME:matriz}
    password: ${DATABASE_PASSWORD}
  jackson:
    # Jackson 3 mapper, with Boot 3 JSON/date/coercion defaults; not the Jackson 2 module.
    use-jackson2-defaults: true
    deserialization:
      fail-on-unknown-properties: true
  sql:
    init:
      mode: never
server:
  port: ${PORT:8080}
  address: ${SERVER_ADDRESS:127.0.0.1}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: strict
        secure: ${COOKIE_SECURE:false}
  error:
    include-message: never
    include-stacktrace: never
matriz:
  demo:
    enabled: ${DEMO_ENABLED:false}
