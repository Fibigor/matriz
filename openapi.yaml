openapi: 3.1.0
info:
  title: Matriz — API atual com extensões de tarefas V4
  version: 0.4.0-rc.1
  description: |
    Contrato da demonstração implementada, não uma API de produção certificada.
    Substitui o contrato parcial/Bearer/responsável único da ficha 02.
    A autenticação usa email e palavra-passe de contas locais ativas; a aplicação
    mantém sessão no servidor, CSRF e hashes scrypt. Não cria contas públicas.
    O logout invalida a sessão Matriz.
    A retenção anual é apenas um pressuposto provisório, sem eliminação automática;
    âmbito e evento inicial não estão definidos. p95 é uma métrica a observar,
    sem meta nem carga de referência aprovadas. Produção está diferida.
    Âmbito académico aprovado pelo autor em 13-11-2026, não validação do cliente.
    IDs são texto opaco; UUID da tarefa é estável e key MAT-n é global sequencial
    com lacunas permitidas. Datas são instantes UTC. Descrição/comentário são strings
    apresentadas em Markdown básico seguro, sem HTML/imagens/GFM, só HTTP/HTTPS.
    Conta ativa e participação são verificadas no servidor em cada operação.
    Projeto alheio e inexistente dão 404 com o mesmo detalhe; membro sem gestão dá 403.
    Campos JSON desconhecidos são recusados com 400; formato/tipo inválido dá 400;
    validação semântica 422, versão antiga 409, falha de dados 503.
    Falha de transporte não prova rollback: não repetir escritas automaticamente.
    Listas paginadas usam createdAt ascendente e id ascendente como desempate.
    Pagination é baseada em 1; página além do fim é vazia; zero itens implica zero páginas.
    Nomes, títulos e comentários são aparados nas extremidades; descrições e pesquisa
    conservam espaços. Limites em pontos de código Unicode.
    Novos campos opcionais de resposta são emitidos como null; listas sem itens são [].
    BLOCKS tem efeito real: todos os bloqueadores diretos DONE antes de concluir;
    início permitido, reabertura de bloqueador recusada com qualquer dependente direto DONE.
    Anexos BYTEA: 5 diretos por tarefa, 5 por comentário, 4 MiB cada, validação limitada.
    Upload/limite técnico 413; MIME do pedido/parte não suportado 415;
    formato de ficheiro/count/ciclo/bloqueio semântico 422, versão antiga 409.
servers:
  - url: /api
security:
  - Session: []
tags:
  - name: Identidade
  - name: Projetos
  - name: Tarefas
paths:
  /auth/csrf:
    get:
      tags: [Identidade]
      operationId: getCsrf
      summary: Obter token atual de CSRF, incluindo antes do login
      security: []
      responses:
        '200':
          description: Token associado à sessão; atualizar após login/logout.
          content:
            application/json:
              schema:
                type: object
                required: [headerName, token]
                properties:
                  headerName: { type: string, const: X-CSRF-TOKEN }
                  token: { type: string }
  /auth/login:
    post:
      tags: [Identidade]
      operationId: login
      summary: Autenticar uma conta local ativa
      description: Erros de credenciais são genéricos; cinco falhas por email/endereço em 15 minutos bloqueiam novas tentativas durante 15 minutos.
      security:
        - CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Credenciais aceites; sessão criada no servidor.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/Failure' }
        '401': { $ref: '#/components/responses/Failure' }
        '403': { $ref: '#/components/responses/Failure' }
        '429':
          description: Limite de tentativas atingido.
          headers:
            Retry-After: { schema: { type: integer, minimum: 1 } }
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
  /auth/me:
    get:
      tags: [Identidade]
      operationId: currentUser
      summary: Consultar perfil autenticado e ativo
      responses:
        '200':
          description: Perfil atual.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Failure' }
  /auth/logout:
    post:
      tags: [Identidade]
      operationId: logout
      summary: Invalidar sessão e remover cookie
      security:
        - CsrfToken: []
      responses:
        '204': { description: Sessão invalidada. }
        '403': { $ref: '#/components/responses/Failure' }
  /projects:
    get:
      tags: [Projetos]
      operationId: listProjects
      summary: Listar projetos acessíveis com pesquisa pelo nome
      parameters:
        - name: search
          in: query
          schema: { type: string, default: '' }
          description: Substring literal do nome, sem distinção entre maiúsculas/minúsculas.
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Projetos acessíveis correspondentes à pesquisa.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Project' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        default: { $ref: '#/components/responses/Failure' }
    post:
      tags: [Projetos]
      operationId: createProject
      summary: Criar projeto e participação do gestor autenticado atomicamente
      security:
        - Session: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProject' }
      responses:
        '201':
          description: Projeto persistido; versão 1 e zero tarefas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Failure' }
  /projects/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projetos]
      operationId: getProject
      summary: Consultar projeto e agregados globais
      responses:
        '200':
          description: Contexto autorizado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Failure' }
    put:
      tags: [Projetos]
      operationId: updateProject
      summary: Gestor edita projeto com versão atual
      security:
        - Session: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/ProjectFields'
                - type: object
                  required: [version]
                  properties:
                    version: { $ref: '#/components/schemas/Version' }
              unevaluatedProperties: false
      responses:
        '200':
          description: Projeto atualizado; versão incrementada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Project' }
        default: { $ref: '#/components/responses/Failure' }
    delete:
      tags: [Projetos]
      operationId: deleteProject
      summary: Gestor elimina projeto, tarefas, atribuições, comentários e participações
      description: Operação transacional; não elimina utilizadores. A interface exige confirmação.
      security:
        - Session: []
          CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/Version'
      responses:
        '204': { description: Projeto e dependentes removidos. }
        default: { $ref: '#/components/responses/Failure' }
  /projects/{projectId}/members:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Projetos]
      operationId: listMembers
      summary: Participante consulta membros atuais do projeto
      description: Lista não paginada, ordenada por displayName e id; não é diretório de contas.
      responses:
        '200':
          description: Membros atuais, incluindo gestor, com estado ativo.
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/Member' } }
        default: { $ref: '#/components/responses/Failure' }
    post:
      tags: [Projetos]
      operationId: addMember
      summary: Gestor adiciona conta ativa existente por id exato
      description: Adição repetida não duplica a participação.
      security:
        - Session: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [userId]
              properties:
                userId: { $ref: '#/components/schemas/Id' }
      responses:
        '204': { description: Participação existente ou criada. }
        default: { $ref: '#/components/responses/Failure' }
  /projects/{projectId}/members/{userId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/UserId'
    delete:
      tags: [Projetos]
      operationId: removeMember
      summary: Gestor remove membro sem atribuições
      description: Gestor não removível; atribuições, mesmo concluídas, bloqueiam remoção (409).
      security:
        - Session: []
          CsrfToken: []
      responses:
        '204': { description: Participação ausente; acesso revogado nas operações seguintes. }
        default: { $ref: '#/components/responses/Failure' }
  /projects/{projectId}/tasks:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      tags: [Tarefas]
      operationId: listTasks
      summary: Consultar tarefas filtradas e progresso global
      description: |
        items/pagination refletem filtros; project/progress refletem todas as tarefas do projeto.
        Leitura no mesmo retrato transacional. Não confundir progress.total com totalItems filtrado.
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/Status' }
        - name: priority
          in: query
          schema: { $ref: '#/components/schemas/Priority' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página filtrada com progresso global.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TaskPage' }
        default: { $ref: '#/components/responses/Failure' }
    post:
      tags: [Tarefas]
      operationId: createTask
      summary: Participante cria tarefa TODO sem responsáveis
      security:
        - Session: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title]
              properties:
                title:
                  type: string
                  minLength: 1
                  description: Entre 1 e 200 pontos de código após remover espaços nas extremidades.
                description: { $ref: '#/components/schemas/OptionalDescription' }
                priority:
                  oneOf:
                    - $ref: '#/components/schemas/Priority'
                    - type: 'null'
                  default: MEDIUM
                type:
                  oneOf:
                    - $ref: '#/components/schemas/TaskType'
                    - type: 'null'
                  default: TASK
                  description: Omitido ou null na criação usa TASK; null explícito no PUT é inválido.
                weight: { $ref: '#/components/schemas/NullableWeight' }
            example: { title: Preparar demonstração, description: Rever o fluxo completo., priority: HIGH }
      responses:
        '201':
          description: Tarefa persistida; versão 1, createdAt igual a updatedAt.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        default: { $ref: '#/components/responses/Failure' }
  /projects/{projectId}/tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tarefas]
      operationId: getTask
      summary: Participante consulta tarefa do mesmo projeto
      responses:
        '200':
          description: Tarefa atual.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        default: { $ref: '#/components/responses/Failure' }
    put:
      tags: [Tarefas]
      operationId: updateTask
      summary: Participante substitui campos editáveis com versão atual
      description: |
        Concluir não exige responsável, mas exige todos os bloqueadores diretos DONE.
        Reabrir bloqueador com qualquer dependente direto DONE dá 422 status.
        type/weight omitidos preservam; type null explícito é 422; weight null limpa.
        closeReason omitido preserva em DONE->DONE, entrada em DONE dá null;
        reabertura limpa motivo, motivo não null fora de DONE é 422 closeReason.
        description omitida/null continua a normalizar para vazio.
        PUT aceite incrementa versão mesmo idêntico; idêntico não cria evento.
      security:
        - Session: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, status, priority, version]
              properties:
                title:
                  type: string
                  minLength: 1
                  description: Entre 1 e 200 pontos de código após remover espaços nas extremidades.
                description: { $ref: '#/components/schemas/OptionalDescription' }
                status: { $ref: '#/components/schemas/Status' }
                priority: { $ref: '#/components/schemas/Priority' }
                version: { $ref: '#/components/schemas/Version' }
                type: { $ref: '#/components/schemas/TaskType' }
                weight: { $ref: '#/components/schemas/NullableWeight' }
                closeReason: { $ref: '#/components/schemas/NullableCloseReason' }
      responses:
        '200':
          description: Tarefa atualizada e versão incrementada.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        default: { $ref: '#/components/responses/Failure' }
    delete:
      tags: [Tarefas]
      operationId: deleteTask
      summary: Participante elimina tarefa e dependentes
      description: |
        Cascata de atribuições/comentários/links/anexos/história da tarefa.
        Extremos sobreviventes recebem LINK_REMOVED, sem alterar estado/versão/datas;
        eliminar bloqueador desbloqueia sem mudar estados dos dependentes.
      security:
        - Session: []
          CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/Version'
      responses:
        '204': { description: Tarefa e dependentes removidos atomicamente. }
        default: { $ref: '#/components/responses/Failure' }
  /projects/{projectId}/tasks/{taskId}/assignments/{userId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/UserId'
    put:
      tags: [Tarefas]
      operationId: assignTask
      summary: Gestor atribui participante ativo do mesmo projeto
      description: N:M; repetir com versão atual não duplica nem incrementa a versão.
      security:
        - Session: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VersionInput' }
      responses:
        '200':
          description: Tarefa com lista atual de responsáveis.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        default: { $ref: '#/components/responses/Failure' }
    delete:
      tags: [Tarefas]
      operationId: unassignTask
      summary: Gestor retira uma atribuição com versão atual
      security:
        - Session: []
          CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/Version'
      responses:
        '200':
          description: Tarefa com atribuição ausente, restantes preservadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Task' }
        default: { $ref: '#/components/responses/Failure' }
  /projects/{projectId}/tasks/{taskId}/comments:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tarefas]
      operationId: listComments
      summary: Participante consulta comentários paginados
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Comentários com autoria e data persistidas.
          content:
            application/json:
              schema:
                type: object
                required: [items, pagination]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Comment' } }
                  pagination: { $ref: '#/components/schemas/Pagination' }
        default: { $ref: '#/components/responses/Failure' }
    post:
      tags: [Tarefas]
      operationId: createComment
      summary: Participante comenta; autor e data são definidos no servidor
      description: |
        JSON antigo sem ficheiros devolve attachments vazio; multipart exige parte comment
        application/json e files repetidos opcionais (até 5, 4 MiB cada).
        Texto sempre obrigatório; comentário/lote/evento atómicos, sem upload posterior
        ou edição/eliminação de comentário isolado. Não altera versão/updatedAt da tarefa.
      security:
        - Session: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  description: Entre 1 e 2 000 pontos de código após remover espaços nas extremidades.
          multipart/form-data:
            schema:
              type: object
              required: [comment]
              properties:
                comment: { $ref: '#/components/schemas/CommentInput' }
                files:
                  type: array
                  maxItems: 5
                  items: { type: string, format: binary }
            encoding:
              comment:
                contentType: application/json
              files:
                contentType: image/png, image/jpeg, image/gif, image/webp, application/pdf, text/plain, text/markdown
                style: form
                explode: true
      responses:
        '201':
          description: Comentário persistido.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Comment' }
        '400': { $ref: '#/components/responses/Failure' }
        '413': { $ref: '#/components/responses/Failure' }
        '415': { $ref: '#/components/responses/Failure' }
        '422': { $ref: '#/components/responses/Failure' }
        default: { $ref: '#/components/responses/Failure' }
  /projects/{projectId}/tasks/{taskId}/links:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tarefas]
      operationId: listTaskLinks
      summary: Listar relações incidentes de entrada e saída
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página ascendente de relações incidentes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkPage' }
        default: { $ref: '#/components/responses/Failure' }
    post:
      tags: [Tarefas]
      operationId: createTaskLink
      summary: Participante cria relação com ambas as versões atuais
      description: |
        Mesmo projeto, sem auto-relação. RELATED simétrica com IDs em ordem canónica;
        BLOCKS/DUPLICATES dirigidas da tarefa da rota para targetTaskId.
        Tipos distintos coexistem; DUPLICATES não exige aciclicidade.
        BLOCKS proíbe ciclos e A não DONE BLOCKS B DONE (422 targetTaskId).
        Novo link incrementa ambas as versões/updatedAt e emite evento por extremo;
        duplicado com versões atuais dá 200 sem incremento/evento.
        version pertence à tarefa da rota e targetVersion ao outro extremo.
      security:
        - Session: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LinkInput' }
      responses:
        '201':
          description: Relação nova, tarefas com versões incrementadas.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkMutation' }
        '200':
          description: Relação existente, sem alterações; exige ambas as versões atuais.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkMutation' }
        '409': { $ref: '#/components/responses/Failure' }
        '422': { $ref: '#/components/responses/Failure' }
        default: { $ref: '#/components/responses/Failure' }
  /projects/{projectId}/tasks/{taskId}/links/{linkId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/LinkId'
    delete:
      tags: [Tarefas]
      operationId: deleteTaskLink
      summary: Remover relação incidente com ambas as versões atuais
      description: |
        version é da tarefa da rota, targetVersion do outro extremo, mesmo pela entrada.
        Incrementa ambas uma vez; desbloqueia sem alterar estados. Link não incidente dá 404.
      security:
        - Session: []
          CsrfToken: []
      parameters:
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/TargetVersion'
      responses:
        '200':
          description: Tarefas dos dois extremos atualizadas; não devolve link eliminado.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LinkDeletion' }
        '409': { $ref: '#/components/responses/Failure' }
        default: { $ref: '#/components/responses/Failure' }
  /projects/{projectId}/tasks/{taskId}/attachments:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tarefas]
      operationId: listTaskAttachments
      summary: Listar só anexos diretos, sem paginação
      responses:
        '200':
          description: Metadados diretos por createdAt/id, sem bytes ou ficheiros dos comentários.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentList' }
        default: { $ref: '#/components/responses/Failure' }
    post:
      tags: [Tarefas]
      operationId: uploadTaskAttachments
      summary: Participante adiciona lote atómico de anexos diretos
      description: |
        Repetir partes files, 1..5; máximo atual 5 diretos por tarefa e 4 MiB por ficheiro.
        MIME e extensão devem corresponder; assinaturas/estrutura limitada PNG/JPEG/GIF/WebP/PDF;
        TXT/MD UTF-8 estrito sem NUL ou markup HTML/XML/SVG. Não antivírus/certificação PDF.
        Extensões permitidas por MIME: .png, .jpg/.jpeg, .gif, .webp, .pdf, .txt,
        .md/.markdown respetivamente. Parâmetros MIME são removidos para storage/download.
        Lote validado antes de gravar, count+storage+eventos sob lock do projeto.
        Nome sem diretórios, NFC, sem controlos/format chars, até 255 pontos Unicode.
        Não altera versão/updatedAt da tarefa. Servlet 4MB/21MB, descarte limitado 32MB;
        pedidos arbitrariamente maiores/abortados não têm corpo HTTP legível garantido.
      security:
        - Session: []
          CsrfToken: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [files]
              properties:
                files:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: string, format: binary }
            encoding:
              files:
                contentType: image/png, image/jpeg, image/gif, image/webp, application/pdf, text/plain, text/markdown
                style: form
                explode: true
      responses:
        '201':
          description: Só metadados dos ficheiros do novo lote.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttachmentList' }
        '400': { $ref: '#/components/responses/Failure' }
        '413': { $ref: '#/components/responses/Failure' }
        '415': { $ref: '#/components/responses/Failure' }
        '422': { $ref: '#/components/responses/Failure' }
        default: { $ref: '#/components/responses/Failure' }
  /projects/{projectId}/tasks/{taskId}/attachments/{attachmentId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
      - $ref: '#/components/parameters/AttachmentId'
    get:
      tags: [Tarefas]
      operationId: downloadTaskAttachment
      summary: Descarregar ficheiro direto ou de comentário com acesso atual
      responses:
        '200':
          description: Bytes, não JSON; MIME canónico, sempre attachment.
          headers:
            Content-Length:
              schema: { type: integer, minimum: 1, maximum: 4194304 }
            Content-Disposition:
              schema: { type: string }
              description: attachment; nome UTF-8 sanitizado.
            X-Content-Type-Options:
              schema: { type: string, const: nosniff }
            Cache-Control:
              schema: { type: string, const: no-store }
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/gif: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
            application/pdf: { schema: { type: string, format: binary } }
            text/plain: { schema: { type: string, format: binary } }
            text/markdown: { schema: { type: string, format: binary } }
        default: { $ref: '#/components/responses/Failure' }
    delete:
      tags: [Tarefas]
      operationId: deleteTaskAttachment
      summary: Autor ou gestor ainda participante elimina ficheiro direto ou de comentário
      description: Sem versão; preserva metadados históricos, não muda versão/updatedAt da tarefa.
      security:
        - Session: []
          CsrfToken: []
      responses:
        '204': { description: Ficheiro removido, evento gravado atomicamente. }
        '403': { $ref: '#/components/responses/Failure' }
        default: { $ref: '#/components/responses/Failure' }
  /projects/{projectId}/tasks/{taskId}/activity:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [Tarefas]
      operationId: listTaskActivity
      summary: Consultar história paginada, sem API de escrita
      description: |
        Ator/data do servidor; todos os eventos, sem filtro API.
        TASK_UPDATED só alterações efetivas, title/description só flags, nunca texto copiado.
        ASSIGNEES_CHANGED usa IDs ordenados; COMMENT_ADDED tem commentId e attachments,
        sem cópia de conteúdo ou eventos ATTACHMENT_ADDED duplicados.
        LINK_ADDED/REMOVED por extremo, snapshot sem FK ao recurso removido.
        Anexos diretos usam attachment singular; remoção de ficheiro de comentário tem commentId.
        Referências não usadas null, listas vazias []; sem backfill, cascata com a tarefa.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: Página ascendente no mesmo snapshot count/items.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActivityPage' }
        default: { $ref: '#/components/responses/Failure' }
components:
  securitySchemes:
    Session:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: Sessão Matriz no servidor; cookie HttpOnly/SameSite Strict; Secure em HTTPS; timeout inativo 30 min.
    CsrfToken:
      type: apiKey
      in: header
      name: X-CSRF-TOKEN
      description: Token obtido em GET /auth/csrf; não é credencial de autenticação.
  parameters:
    ProjectId: { name: projectId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    TaskId: { name: taskId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    UserId: { name: userId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    LinkId: { name: linkId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    AttachmentId: { name: attachmentId, in: path, required: true, schema: { $ref: '#/components/schemas/Id' } }
    TargetVersion: { name: targetVersion, in: query, required: true, schema: { $ref: '#/components/schemas/Version' } }
    Version: { name: version, in: query, required: true, schema: { $ref: '#/components/schemas/Version' } }
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    PageSize: { name: pageSize, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
  responses:
    Failure:
      description: |
        400 formato/tipo/campo desconhecido; 401 sessão ausente/inativa;
        403 CSRF/permissão; 404 recurso indisponível; 409 versão antiga/restrições existentes;
        413 tamanho de upload/pedido; 415 media type de pedido/parte não suportado;
        429 limite de tentativas de login;
        422 validação; 503 operação de dados falhou. Não expõe SQL ou conteúdo interno.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Id: { type: string, minLength: 1 }
    Version: { type: integer, format: int64, minimum: 1 }
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 200, writeOnly: true }
    VersionInput:
      type: object
      additionalProperties: false
      required: [version]
      properties:
        version: { $ref: '#/components/schemas/Version' }
    Status: { type: string, enum: [TODO, IN_PROGRESS, DONE] }
    Priority: { type: string, enum: [LOW, MEDIUM, HIGH] }
    TaskType: { type: string, enum: [TASK, BUG, IMPROVEMENT] }
    NullableWeight:
      type: [integer, 'null']
      enum: [null, 1, 2, 3, 5, 8, 13]
      description: Na criação omissão/null dá null; no PUT omissão preserva e null limpa.
    NullableCloseReason:
      type: [string, 'null']
      enum: [null, COMPLETED, CANCELLED, DUPLICATE, WONT_DO]
      description: Só não null em DONE; omissão preserva em DONE->DONE, entrada em DONE dá null, reabertura limpa.
    OptionalDescription:
      type: [string, 'null']
      maxLength: 2000
      description: Omitida ou null normaliza para string vazia; resposta é sempre string.
    User:
      type: object
      required: [id, displayName]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        displayName: { type: string }
    Member:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [active, role]
          properties:
            active: { type: boolean }
            role: { type: string, enum: [MANAGER, MEMBER] }
    Progress:
      type: object
      required: [total, todo, inProgress, done, completedPercent]
      description: Total global; todos os DONE contam independentemente de motivo/peso; percentagem 0 se vazio, arredondada com meios para cima.
      properties:
        total: { type: integer, minimum: 0 }
        todo: { type: integer, minimum: 0 }
        inProgress: { type: integer, minimum: 0 }
        done: { type: integer, minimum: 0 }
        completedPercent: { type: integer, minimum: 0, maximum: 100 }
      example: { total: 5, todo: 2, inProgress: 1, done: 2, completedPercent: 40 }
    Pagination:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1, maximum: 100 }
        totalItems: { type: integer, minimum: 0 }
        totalPages: { type: integer, minimum: 0 }
    ProjectFields:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          description: Entre 1 e 120 pontos de código após remover espaços nas extremidades.
        description: { $ref: '#/components/schemas/OptionalDescription' }
    CreateProject:
      allOf:
        - $ref: '#/components/schemas/ProjectFields'
        - type: object
          properties:
            version:
              type: 'null'
              description: Campo reservado; omitir na criação. Apenas null é tolerado.
      unevaluatedProperties: false
      example: { name: Demonstração, description: Dados fictícios. }
    Project:
      type: object
      required: [id, name, description, ownerUserId, currentRole, version, createdAt, progress]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        name: { type: string }
        description: { type: string }
        ownerUserId: { $ref: '#/components/schemas/Id' }
        currentRole: { type: string, enum: [MANAGER, MEMBER] }
        version: { $ref: '#/components/schemas/Version' }
        createdAt: { type: string, format: date-time }
        progress: { $ref: '#/components/schemas/Progress' }
    Task:
      type: object
      required: [id, projectId, title, description, status, priority, assignees, version, createdAt, updatedAt, key, type, weight, closeReason]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        projectId: { $ref: '#/components/schemas/Id' }
        title: { type: string }
        description: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        priority: { $ref: '#/components/schemas/Priority' }
        assignees: { type: array, default: [], items: { $ref: '#/components/schemas/User' } }
        key: { type: string, pattern: '^MAT-[1-9][0-9]*$' }
        type: { $ref: '#/components/schemas/TaskType' }
        weight: { $ref: '#/components/schemas/NullableWeight' }
        closeReason: { $ref: '#/components/schemas/NullableCloseReason' }
        version: { $ref: '#/components/schemas/Version' }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    TaskPage:
      type: object
      required: [project, items, pagination, progress]
      properties:
        project: { $ref: '#/components/schemas/Project' }
        items: { type: array, items: { $ref: '#/components/schemas/Task' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
        progress: { $ref: '#/components/schemas/Progress' }
    Comment:
      type: object
      required: [id, taskId, author, content, createdAt, attachments]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        taskId: { $ref: '#/components/schemas/Id' }
        author: { $ref: '#/components/schemas/User' }
        content: { type: string }
        createdAt: { type: string, format: date-time }
        attachments:
          type: array
          default: []
          maxItems: 5
          items: { $ref: '#/components/schemas/TaskAttachment' }
    CommentInput:
      type: object
      additionalProperties: false
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          description: 1..2000 pontos de código após aparar; obrigatório mesmo com ficheiros.
    LinkType: { type: string, enum: [RELATED, BLOCKS, DUPLICATES] }
    TaskReference:
      type: object
      required: [id, key, title, status, version]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        key: { type: string }
        title: { type: string }
        status: { $ref: '#/components/schemas/Status' }
        version: { $ref: '#/components/schemas/Version' }
    TaskLink:
      type: object
      required: [id, projectId, type, sourceTaskId, targetTaskId, createdBy, createdAt, sourceTask, targetTask]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        projectId: { $ref: '#/components/schemas/Id' }
        type: { $ref: '#/components/schemas/LinkType' }
        sourceTaskId: { $ref: '#/components/schemas/Id' }
        targetTaskId: { $ref: '#/components/schemas/Id' }
        createdBy: { $ref: '#/components/schemas/User' }
        createdAt: { type: string, format: date-time }
        sourceTask: { $ref: '#/components/schemas/TaskReference' }
        targetTask: { $ref: '#/components/schemas/TaskReference' }
    LinkInput:
      type: object
      additionalProperties: false
      required: [type, targetTaskId, version, targetVersion]
      properties:
        type: { $ref: '#/components/schemas/LinkType' }
        targetTaskId: { $ref: '#/components/schemas/Id' }
        version: { $ref: '#/components/schemas/Version' }
        targetVersion: { $ref: '#/components/schemas/Version' }
    LinkMutation:
      type: object
      required: [link, task, otherTask]
      properties:
        link: { $ref: '#/components/schemas/TaskLink' }
        task: { $ref: '#/components/schemas/Task' }
        otherTask: { $ref: '#/components/schemas/Task' }
    LinkDeletion:
      type: object
      required: [task, otherTask]
      properties:
        task: { $ref: '#/components/schemas/Task' }
        otherTask: { $ref: '#/components/schemas/Task' }
    LinkPage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, default: [], items: { $ref: '#/components/schemas/TaskLink' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    TaskAttachment:
      type: object
      required: [id, taskId, commentId, filename, contentType, sizeBytes, author, createdAt, canDelete]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        taskId: { $ref: '#/components/schemas/Id' }
        commentId: { type: [string, 'null'] }
        filename: { type: string, maxLength: 255 }
        contentType:
          type: string
          enum: [image/png, image/jpeg, image/gif, image/webp, application/pdf, text/plain, text/markdown]
        sizeBytes: { type: integer, minimum: 1, maximum: 4194304 }
        author: { $ref: '#/components/schemas/User' }
        createdAt: { type: string, format: date-time }
        canDelete: { type: boolean, description: Autor ou gestor da sessão atual; acesso continua obrigatório. }
    AttachmentList:
      type: object
      required: [items]
      properties:
        items: { type: array, default: [], maxItems: 5, items: { $ref: '#/components/schemas/TaskAttachment' } }
    ActivityType:
      type: string
      enum: [TASK_CREATED, TASK_UPDATED, ASSIGNEES_CHANGED, COMMENT_ADDED, LINK_ADDED, LINK_REMOVED, ATTACHMENT_ADDED, ATTACHMENT_REMOVED]
    TextValue:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind: { type: string, const: text }
        value: { type: [string, 'null'] }
    NumberValue:
      type: object
      additionalProperties: false
      required: [kind, value]
      properties:
        kind: { type: string, const: number }
        value: { type: [integer, 'null'] }
    UserIdsValue:
      type: object
      additionalProperties: false
      required: [kind, userIds]
      properties:
        kind: { type: string, const: userIds }
        userIds: { type: array, default: [], items: { $ref: '#/components/schemas/Id' } }
    ActivityValue:
      oneOf:
        - $ref: '#/components/schemas/TextValue'
        - $ref: '#/components/schemas/NumberValue'
        - $ref: '#/components/schemas/UserIdsValue'
      discriminator:
        propertyName: kind
        mapping:
          text: '#/components/schemas/TextValue'
          number: '#/components/schemas/NumberValue'
          userIds: '#/components/schemas/UserIdsValue'
    TextChange:
      type: object
      additionalProperties: false
      required: [field, oldValue, newValue]
      properties:
        field: { type: string, enum: [status, priority, type, closeReason] }
        oldValue: { $ref: '#/components/schemas/TextValue' }
        newValue: { $ref: '#/components/schemas/TextValue' }
    NumberChange:
      type: object
      additionalProperties: false
      required: [field, oldValue, newValue]
      properties:
        field: { type: string, const: weight }
        oldValue: { $ref: '#/components/schemas/NumberValue' }
        newValue: { $ref: '#/components/schemas/NumberValue' }
    AssigneesChange:
      type: object
      additionalProperties: false
      required: [field, oldValue, newValue]
      properties:
        field: { type: string, const: assignees }
        oldValue: { $ref: '#/components/schemas/UserIdsValue' }
        newValue: { $ref: '#/components/schemas/UserIdsValue' }
    ActivityChange:
      oneOf:
        - $ref: '#/components/schemas/TextChange'
        - $ref: '#/components/schemas/NumberChange'
        - $ref: '#/components/schemas/AssigneesChange'
      description: Discriminado por field; valores text/number/userIds têm discriminator kind.
      discriminator:
        propertyName: field
        mapping:
          status: '#/components/schemas/TextChange'
          priority: '#/components/schemas/TextChange'
          type: '#/components/schemas/TextChange'
          closeReason: '#/components/schemas/TextChange'
          weight: '#/components/schemas/NumberChange'
          assignees: '#/components/schemas/AssigneesChange'
    RelationActivity:
      type: object
      required: [id, type, sourceTaskId, targetTaskId, otherTaskId, otherTaskKey]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        type: { $ref: '#/components/schemas/LinkType' }
        sourceTaskId: { $ref: '#/components/schemas/Id' }
        targetTaskId: { $ref: '#/components/schemas/Id' }
        otherTaskId: { $ref: '#/components/schemas/Id' }
        otherTaskKey: { type: string }
    AttachmentActivity:
      type: object
      required: [id, filename, contentType, sizeBytes]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        filename: { type: string }
        contentType: { type: string }
        sizeBytes: { type: integer, minimum: 1, maximum: 4194304 }
    TaskActivity:
      type: object
      required: [id, taskId, actor, createdAt, type, changes, titleChanged, descriptionChanged, commentId, relation, attachment, attachments]
      properties:
        id: { $ref: '#/components/schemas/Id' }
        taskId: { $ref: '#/components/schemas/Id' }
        actor: { $ref: '#/components/schemas/User' }
        createdAt: { type: string, format: date-time }
        type: { $ref: '#/components/schemas/ActivityType' }
        changes: { type: array, default: [], items: { $ref: '#/components/schemas/ActivityChange' } }
        titleChanged: { type: boolean }
        descriptionChanged: { type: boolean }
        commentId: { type: [string, 'null'] }
        relation:
          oneOf:
            - $ref: '#/components/schemas/RelationActivity'
            - type: 'null'
        attachment:
          oneOf:
            - $ref: '#/components/schemas/AttachmentActivity'
            - type: 'null'
        attachments: { type: array, default: [], items: { $ref: '#/components/schemas/AttachmentActivity' } }
    ActivityPage:
      type: object
      required: [items, pagination]
      properties:
        items: { type: array, default: [], items: { $ref: '#/components/schemas/TaskActivity' } }
        pagination: { $ref: '#/components/schemas/Pagination' }
    Problem:
      type: object
      required: [type, title, status, detail]
      properties:
        type: { type: string, format: uri-reference }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, format: uri-reference }
        errors:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
