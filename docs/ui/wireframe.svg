  <text x="48" y="210">Painel</text>
  <text x="48" y="250" class="accent">Projetos</text>
  <text x="48" y="292" class="small">Espaço de trabalho</text>
  <text x="220" y="210" class="small">Projetos / Alfa</text>
  <text x="220" y="246" class="h1">Alfa</text>
  <text x="220" y="279">5 tarefas · 2 concluídas · 40%</text>
  <text x="220" y="305" class="small">Agregados globais, independentes de filtros/página</text>
  <rect x="220" y="330" width="350" height="84" rx="6" class="input"/>
  <text x="233" y="357">Estado: Todos ▾</text>
  <text x="233" y="388">Prioridade: Todas ▾</text>
  <rect x="220" y="430" width="350" height="38" rx="5" class="button"/>
  <text x="233" y="455">Nova tarefa</text>
  <text x="220" y="500" class="small">Chave / Título · Estado · Prioridade · Responsáveis</text>
  <path d="M220 516H580" class="line"/>
  <text x="220" y="546" class="accent">MAT-21 · Rever guia de demonstração</text>
  <text x="220" y="574">Concluída · Alta · Ana, Bruno</text>
  <text x="220" y="600" class="small">Melhoria · Peso 3</text>
  <path d="M220 618H580" class="line"/>
  <text x="220" y="649">MAT-22 · Preparar dados fictícios</text>
  <text x="220" y="677">Em curso · Média · Bruno</text>
  <path d="M220 699H580" class="line"/>
  <text x="220" y="730">MAT-23 · Rever textos</text>
  <text x="220" y="758">Por fazer · Baixa · Sem responsáveis</text>
  <text x="220" y="800" class="small">Linhas representativas · Anterior / Seguinte</text>
  <text x="220" y="854" class="small">Pesquisa pelo nome na vista Projetos.</text>
  <text x="220" y="879" class="small">Filtros de tarefas: estado/prioridade.</text>
  <text x="220" y="921" class="small">Estados alternativos (não simultâneos):</text>
  <text x="220" y="948" class="small">A carregar… / Sem tarefas / Erro + retry.</text>
  <text x="220" y="975" class="small">Sucesso apenas após resposta confirmada.</text>
  <text x="220" y="1018" class="small">Nova tarefa: TODO, sem responsáveis,</text>
  <text x="220" y="1044" class="small">prioridade MEDIUM e tipo TASK por omissão.</text>
  <text x="220" y="1087" class="small">Nome projeto: 1–120 pontos de código.</text>
  <text x="220" y="1113" class="small">Título tarefa: 1–200; descrição: até 2 000.</text>
  <text x="220" y="1156" class="small">Lista de fundo inerte com painel modal;</text>
  <text x="220" y="1182" class="small">foco/Escape/devolução no código.</text>
  <text x="220" y="1208" class="small">Comportamentos não provados pelo desenho.</text>
  <!-- Painel: secções empilhadas representam conteúdo com scroll, não viewport literal. -->
  <rect x="600" y="183" width="550" height="1238" rx="6" fill="#202f46" stroke="#84beff"/>
  <text x="618" y="213" class="small">Projetos / ← Projeto</text>
  <text x="907" y="213" class="accent">Página completa · Fechar ×</text>
  <text x="618" y="244" class="small">MAT-21 · Melhoria · Peso 3</text>
  <text x="618" y="277" class="h2">Rever guia de demonstração</text>
  <text x="618" y="305">Concluída · Prioridade Alta · Motivo: Concluído</text>
  <text x="618" y="341" class="h2">Editar tarefa</text>
  <rect x="618" y="352" width="512" height="41" rx="4" class="input"/>
  <text x="630" y="378">Título *: Rever guia de demonstração</text>
  <text x="618" y="422">Tipo: Melhoria ▾    Peso: 3 ▾    Aplicar template</text>
  <text x="618" y="447" class="small">Peso: sem peso ou 1 / 2 / 3 / 5 / 8 / 13</text>
  <rect x="618" y="461" width="512" height="107" rx="4" class="input"/>
  <text x="630" y="486" class="accent">Descrição · Escrever / Pré-visualizar</text>
  <text x="630" y="515">## Objetivo</text>
  <text x="630" y="543">Clarificar o percurso com **dados fictícios**.</text>
  <text x="618" y="591" class="small">Markdown básico · até 2 000 · sem HTML/imagens/GFM</text>
  <text x="618" y="617" class="small">Só HTTP/HTTPS; template substitui com confirmação.</text>
  <text x="618" y="649">Estado: Concluída ▾    Prioridade: Alta ▾</text>
  <text x="618" y="677">Motivo de fecho: Concluído ▾ (só em DONE)</text>
  <text x="618" y="703" class="small">Opcional: Cancelado / Duplicado / Não será feito.</text>
  <rect x="618" y="720" width="165" height="37" rx="4" class="button"/>
  <text x="632" y="745">Guardar tarefa</text>
  <text x="818" y="745">Eliminar tarefa (confirmar)</text>
  <text x="618" y="790" class="h2">Responsáveis · Ana, Bruno</text>
  <text x="618" y="817" class="small">Gestor adiciona/remove participantes ativos elegíveis.</text>
  <text x="618" y="859" class="h2">Relações</text>
  <text x="618" y="887">MAT-20 → BLOCKS → MAT-21 · Remover</text>
  <text x="618" y="913" class="small">MAT-20 concluída; concluir exige bloqueadores DONE.</text>
  <text x="618" y="940" class="small">RELATED / BLOCKS / DUPLICATES · candidato + Ligar</text>
  <text x="618" y="982" class="h2">Anexos diretos</text>
  <text x="618" y="1010">guia-demo.md · 1 KiB · Descarregar / Remover</text>
  <text x="618" y="1037" class="small">Escolher ficheiros · Enviar · até 5 diretos, 4 MiB cada</text>
  <text x="618" y="1079" class="h2">Atividade · Comentários / Histórico</text>
  <text x="618" y="1107">Ana · 13-11 · “Guia revisto.” · exemplo.txt</text>
  <text x="618" y="1133" class="small">Comentar: texto obrigatório, 1–2 000 pontos de código</text>
  <text x="618" y="1159" class="small">Escrever / Pré-visualizar · ficheiros opcionais · Publicar</text>
  <text x="618" y="1185" class="small">Até 5 por comentário, 4 MiB cada, envio atómico.</text>
  <text x="618" y="1227">Histórico · Ana · Estado: Em curso → Concluída</text>
  <text x="618" y="1253" class="small">Ator/data · alterações tipadas · paginação de eventos</text>
  <text x="618" y="1295" class="small">Secções empilhadas = conteúdo rolável representativo.</text>
  <text x="618" y="1321" class="small">Erro/409 conserva rascunho; substituir exige confirmar.</text>
  <text x="618" y="1347" class="small">Reabertura limpa motivo; todo DONE conta no progresso.</text>
  <text x="618" y="1385" class="small">Sair com rascunhos pede confirmação.</text>
  <text x="1200" y="102" class="h2">B. Móvel ≤960 px / hash direto</text>
