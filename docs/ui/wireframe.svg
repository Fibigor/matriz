<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1720" height="1800" viewBox="0 0 1720 1800" role="img" aria-labelledby="title desc">
  <title id="title">Matriz — lista e detalhe desktop, página móvel</title>
  <desc id="desc">Wireframe documental de 17-11-2026 baseado no código atual, com dados fictícios. Desktop acima de 960 px: lista e painel de detalhe; móvel ou acesso hash direto: página. Inclui filtros, vários responsáveis, MAT, tipo, peso, motivo só em DONE, Markdown, templates, relações, anexos, comentários e história. Não é screenshot nem prova de acessibilidade ou renderização.</desc>
  <defs>
    <style>
      text { font-family: system-ui, sans-serif; fill: #e7edf7; font-size: 15px; }
      .h1 { font-size: 25px; font-weight: 700; }
      .h2 { font-size: 19px; font-weight: 650; }
      .small { font-size: 13px; fill: #b6c4d9; }
      .note { font-size: 14px; fill: #b6c4d9; }
      .accent { fill: #84beff; }
      .panel { fill: #192437; stroke: #63748c; }
      .input { fill: #111b2b; stroke: #75869f; }
      .button { fill: #244b7d; stroke: #84beff; }
      .line { stroke: #63748c; }
    </style>
  </defs>
  <rect width="1720" height="1800" fill="#0c1421"/>
  <text x="30" y="40" class="h1">MATRIZ · UI atual</text>
  <text x="30" y="68" class="note">17-11-2026 · representação documental · dados fictícios · não é screenshot ou validação visual/a11y</text>
  <text x="30" y="102" class="h2">A. Desktop &gt;960 px — abrir tarefa da lista apresenta painel</text>
  <rect x="30" y="120" width="1135" height="1320" rx="8" class="panel"/>
  <rect x="30" y="120" width="1135" height="52" fill="#223b60"/>
  <text x="48" y="153" class="h2">M  MATRIZ</text>
  <text x="940" y="153">Ana · Sair</text>
