  <text x="1236" y="627">## Objetivo</text>
  <text x="1236" y="659">Clarificar o percurso.</text>
  <text x="1225" y="714" class="small">Até 2 000 pontos de código · Markdown básico</text>
  <text x="1225" y="754">Estado: Concluída ▾</text>
  <text x="1225" y="793">Prioridade: Alta ▾</text>
  <text x="1225" y="832">Motivo: Concluído ▾</text>
  <rect x="1225" y="854" width="180" height="38" rx="4" class="button"/>
  <text x="1236" y="880">Guardar tarefa</text>
  <text x="1225" y="931" class="h2">Responsáveis: Ana, Bruno</text>
  <text x="1225" y="975" class="h2">Relações</text>
  <text x="1225" y="1005">Bloqueada por MAT-20 (Concluída)</text>
  <text x="1225" y="1049" class="h2">Anexos diretos</text>
  <text x="1225" y="1079">guia-demo.md · Descarregar</text>
  <text x="1225" y="1123" class="h2">Atividade</text>
  <text x="1225" y="1153">Comentários / Histórico · paginação</text>
  <text x="1225" y="1181" class="small">Comentário + anexos num único envio</text>
  <text x="1225" y="1230" class="small">Mesmas secções e permissões do desktop;</text>
  <text x="1225" y="1257" class="small">página rolável, não painel lateral.</text>
  <text x="1225" y="1299" class="small">Menu móvel abre diálogo modal.</text>
  <text x="1225" y="1326" class="small">Resize conserva o mesmo detalhe/rascunho.</text>
  <text x="1225" y="1385" class="small">Geometria esquemática, não viewport medido.</text>
  <text x="30" y="1486" class="h2">Regras que o desenho não substitui</text>
  <text x="30" y="1520">Estados: Por fazer (TODO), Em curso (IN_PROGRESS), Concluída (DONE). Sem responsável obrigatório para concluir.</text>
  <text x="30" y="1551">BLOCKS: sem ciclos; pode iniciar bloqueada, só conclui com todos os bloqueadores diretos DONE; não reabre bloqueador com dependente direto DONE.</text>
  <text x="30" y="1582">RELATED simétrica; BLOCKS/DUPLICATES dirigidas, mesmo projeto. Criar/remover relação exige versões atuais de ambos os extremos.</text>
  <text x="30" y="1613">Anexos: PNG/JPEG/GIF/WebP/PDF/TXT/Markdown; validação limitada, não antivírus. Download autenticado; só autor/gestor participante elimina.</text>
  <text x="30" y="1644">Comentários não têm edição/eliminação isolada ou anexação posterior. História só leitura, sem cópias de título/descrição/texto de comentário.</text>
  <text x="30" y="1675">Filtros/pesquisa visual de candidatos/história limitam-se à página indicada; não representam novos filtros globais de API.</text>
  <text x="30" y="1724" class="note">Fontes: App, Tasks, TaskDetail/Panel, types, MarkdownEditor, TaskLinks, TaskAttachments, TaskActivity; requisitos/contrato atuais.</text>
  <text x="30" y="1756" class="note">Sem @mentions, notificações, sprints ou novos serviços. Renderização, teclado/resize e inspeção humana continuam a exigir verificação própria.</text>
