services:
  - type: web
    name: matriz-demo
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    autoDeployTrigger: checksPass
    envVars:
      - key: SERVER_ADDRESS
        value: 0.0.0.0
      - key: COOKIE_SECURE
        value: "true"
      - key: DEMO_ENABLED
        value: "true"
      - key: DATABASE_HOST
        fromDatabase:
          name: matriz-demo-db
          property: host
      - key: DATABASE_PORT
        fromDatabase:
          name: matriz-demo-db
          property: port
      - key: DATABASE_NAME
        fromDatabase:
          name: matriz-demo-db
          property: database
      - key: DATABASE_USERNAME
        fromDatabase:
          name: matriz-demo-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: matriz-demo-db
          property: password
databases:
  - name: matriz-demo-db
    databaseName: matriz
    user: matriz
    plan: free
    region: frankfurt
    postgresMajorVersion: "17"
