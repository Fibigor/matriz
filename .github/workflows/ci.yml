name: CI

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-analysis:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: semgrep scan --config .semgrep.yml --config p/java --config p/typescript --error

  backend-tests:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/pom.xml
      - name: Run backend tests
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml test -Dapi.version=1.44

  frontend-checks:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Run component tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  end-to-end:
    name: End-to-end tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start application stack
        run: docker compose --project-name matriz-ci --env-file .env.example up --build --detach
      - name: Wait for application
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in http://localhost:8080/api/auth/csrf; do
            for attempt in $(seq 1 60); do
              if curl --fail --silent "$endpoint" >/dev/null; then
                break
              fi
              if [ "$attempt" -eq 60 ]; then
                echo "Timed out waiting for $endpoint" >&2
                docker compose --project-name matriz-ci --env-file .env.example logs
                exit 1
              fi
              sleep 5
            done
          done
      - name: Run end-to-end tests
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:8080
        run: npm run test:e2e -- --reporter=html
      - name: Upload Playwright reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Stop application stack
        if: always()
        run: docker compose --project-name matriz-ci --env-file .env.example down --remove-orphans
